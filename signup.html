<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>NOVA | Create Account</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="auth-page">

        <div class="auth-container">

            <a href="index.html" class="auth-logo">
                <span>N</span> NOVA
            </a>

            <h1>Create Your Account 🚀</h1>

            <p class="auth-subtitle">
                Join NOVA and start working smarter.
            </p>


            <form id="signupForm">

                <div class="form-group">

                    <label for="signupName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="signupName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="signupEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="signupPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="signupPassword"
                        placeholder="Minimum 6 characters"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Re-enter your password"
                        required
                    >

                </div>


                <label class="terms">

                    <input
                        type="checkbox"
                        required>

                    I agree to the Terms & Conditions

                </label>


                <button
                    type="submit"
                    class="auth-button">

                    Create Account →

                </button>


                <p
                    id="signupMessage"
                    class="auth-message">
                </p>

            </form>


            <div class="auth-divider">
                <span>OR</span>
            </div>


            <p class="auth-footer">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>


            <p class="auth-footer">

                <a href="index.html">
                    ← Back to NOVA
                </a>

            </p>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
